name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build server (Release)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dependencies

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          -DBUILD_FUZZ=OFF

      - name: Build
        run: cmake --build build --parallel "$(nproc)"
